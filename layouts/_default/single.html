{{ define "main" }}
<div class="min-h-screen flex flex-col">
  <div class="bg-linear-to-b from-white to-[#e3e6e7]">
    {{ partial "page-header.html" . }}

    <div class="max-w-3xl mx-auto px-6 py-10">
      <h1 class="text-4xl font-bold text-primary mb-8">{{ .Title }}</h1>
      <div class="page-content">
        {{ .Content }}
      </div>
    </div>
  </div>

  {{ partial "footer.html" . }}
</div>
{{ end }}
