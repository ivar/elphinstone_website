{{ $page := . }}
<nav class="flex flex-wrap justify-center gap-x-8 gap-y-2 px-6 py-4 text-sm font-semibold tracking-wide">
  {{ range site.Menus.main }}
    {{ if eq $page.RelPermalink .URL }}
    <span class="text-primary underline underline-offset-4 cursor-default">{{ .Name }}</span>
    {{ else }}
    <a href="{{ .URL }}" class="text-primary/70 hover:text-primary transition-colors">{{ .Name }}</a>
    {{ end }}
  {{ end }}
</nav>
