{{ define "main" }}
<div id="app" class="w-full">
  <div class="min-h-screen flex flex-col">
    <div class="bg-linear-to-b from-white to-[#e3e6e7]">
      {{ partial "page-header.html" . }}

      <div class="hero py-8">
        <div class="hero-content text-center">
          <div class="max-w-2xl">
            <h1 class="text-4xl font-bold text-primary">{{ .Title }}</h1>
            <div class="py-4 text-lg">{{ .Content }}</div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 px-6 pb-12 max-w-6xl mx-auto">
        {{ range .Params.cards }}
          {{ partial "card.html" . }}
        {{ end }}
      </div>
    </div>

    {{ partial "footer.html" . }}
  </div>
</div>
{{ end }}
