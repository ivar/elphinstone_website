<script>
(() => {
  const payload = JSON.parse(document.getElementById("payload").textContent);
  const form = document.getElementById("unlock");
  const message = document.getElementById("message");
  const store = "course-key:" + payload.salt;
  const bytes = (text) => Uint8Array.from(atob(text), (c) => c.charCodeAt(0));
  const text = (buffer) => btoa(String.fromCharCode(...new Uint8Array(buffer)));
  const saved = () => { try { return localStorage.getItem(store); } catch { return null; } };
  const forget = () => { try { localStorage.removeItem(store); } catch {} };

  if (!window.crypto || !crypto.subtle) {
    message.textContent = "This browser can't open the course here. Try a current browser over a secure (https) connection.";
    form.querySelector("button").disabled = true;
    return;
  }

  // The key that opens the course, worked out from the password (slow on purpose, to hinder guessing).
  async function keyFrom(secret) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
    return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(payload.salt), iterations: payload.iter }, base, 256);
  }
  // Replaces this page with the course. Fails if the key is wrong.
  async function open(rawKey) {
    const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(payload.iv) }, key, bytes(payload.data));
    const html = new TextDecoder().decode(plain);
    document.open();
    document.write(html);
    document.close();
  }

  // Opened before on this device with "remember" ticked.
  if (saved()) open(bytes(saved())).catch(forget);

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = form.querySelector("button");
    button.disabled = true;
    message.textContent = "";
    try {
      const rawKey = await keyFrom(document.getElementById("password").value.trim());
      const remember = document.getElementById("remember").checked;
      await open(rawKey).then(() => {
        if (remember) try { localStorage.setItem(store, text(rawKey)); } catch {}
      });
    } catch {
      message.textContent = "That password didn't work. Check the spelling and capital letters, then try again.";
      button.disabled = false;
      document.getElementById("password").select();
    }
  });
})();
</script>
